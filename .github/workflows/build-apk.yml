
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f main.py || { echo "ERROR: main.py not found"; exit 1; }
          test -f buildozer.spec || { echo "ERROR: buildozer.spec not found"; exit 1; }
          echo "Project files OK"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.34

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Check APK exists
        run: |
          ls -lh bin/*.apk

      - name: Create release tag
        id: release_tag
        run: |
          echo "tag=v0.26-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" bin/*.apk \
            --title "JARVIS APK Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatically built Android APK from commit ${GITHUB_SHA}."
