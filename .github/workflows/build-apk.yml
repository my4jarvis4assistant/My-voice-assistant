name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fix and check project files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files after checkout:"
          ls -la

          echo ""
          echo "Git tracked files:"
          git ls-files

          echo ""
          echo "Checking Python entry file..."

          # If Git checkout still contains Main.py,
          # remove it after confirming main.py exists.
          if [ -f "Main.py" ] && [ -f "main.py" ]; then
            echo "Both Main.py and main.py found."
            echo "Keeping main.py and removing Main.py."
            rm -f "Main.py"
          fi

          # If only Main.py exists, rename it for the build.
          if [ -f "Main.py" ] && [ ! -f "main.py" ]; then
            echo "Main.py found. Renaming it to main.py..."
            mv "Main.py" "main.py"
          fi

          echo ""
          echo "Final project files:"
          ls -la

          echo ""
          echo "Checking main.py..."

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py was not found!"
            exit 1
          fi

          echo "SUCCESS: main.py found."

          echo ""
          echo "Checking buildozer.spec..."

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec was not found!"
            exit 1
          fi

          echo "SUCCESS: buildozer.spec found."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.34

      - name: Build APK
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

          exit ${PIPESTATUS[0]}

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: My-Voice-Assistant-APK
          path: bin/*.apk
          if-no-files-found: error
